<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#000000"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#000;
    --text:#faf6f2;
    --muted:#a89890;
    --rose:#f0a8b0;
    --rose2:#d47884;
    --gold:#e8d0b0;
    --gold2:#c9a87a;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--text)}
  body{
    min-height:100dvh;font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* grid sutil de fundo */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 30%, #000 20%, transparent 75%);
  }
  .orb{
    position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;
  }
  .orb1{width:420px;height:420px;top:-80px;left:50%;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(200,90,110,.2),transparent 70%);
    animation:orb 9s ease-in-out infinite}
  .orb2{width:280px;height:280px;bottom:8%;left:-40px;
    background:radial-gradient(circle,rgba(180,140,80,.12),transparent 70%)}
  .orb3{width:240px;height:240px;bottom:20%;right:-30px;
    background:radial-gradient(circle,rgba(160,70,100,.1),transparent 70%)}
  @keyframes orb{0%,100%{opacity:.85}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}

  .page{
    position:relative;z-index:2;
    max-width:440px;margin:0 auto;
    padding:0 0 56px;
  }

  /* ===== TOP ===== */
  .top{
    padding:18px 18px 0;
    display:flex;align-items:center;justify-content:space-between;
    animation:up .55s cubic-bezier(.22,1,.36,1) both;
  }
  .logo{
    font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;
  }
  .logo b{color:var(--gold);font-weight:600}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:#8fdfb8;padding:6px 11px;border-radius:999px;
    background:rgba(79,212,168,.07);border:1px solid rgba(79,212,168,.2);
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.6s ease infinite}
  @keyframes blink{50%{opacity:.3}}

  /* ===== HEADLINE ===== */
  .headline{
    text-align:center;padding:22px 20px 8px;
    animation:up .65s .05s cubic-bezier(.22,1,.36,1) both;
  }
  .headline .kicker{
    font-size:10px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;
    color:var(--gold);margin-bottom:10px;opacity:.9;
  }
  .headline h1{
    font-family:var(--display);
    font-size:clamp(42px,12vw,54px);font-weight:600;
    line-height:.95;letter-spacing:.01em;
  }
  .headline h1 span{
    background:linear-gradient(115deg,var(--gold),var(--rose),var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .headline p{
    margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.5;
    max-width:280px;margin-left:auto;margin-right:auto;
  }

  /* ===== VIDEO — limpo, sem máscara ===== */
  .stage{
    position:relative;
    margin:6px auto 0;
    max-width:400px;
    animation:up .7s .1s cubic-bezier(.22,1,.36,1) both;
  }
  .stage video{
    display:block;width:100%;
    aspect-ratio:9/11;
    object-fit:cover;
    object-position:center 8%;
    background:#000;
  }
  /* só um fade bem leve embaixo p/ fundir no botão — sem escurecer o rosto */
  .stage-bottom{
    position:absolute;left:0;right:0;bottom:0;height:18%;
    background:linear-gradient(to top, #000 0%, transparent 100%);
    pointer-events:none;
  }

  /* conector visual */
  .connector{
    display:flex;flex-direction:column;align-items:center;
    margin-top:-6px;margin-bottom:4px;
    animation:up .7s .18s cubic-bezier(.22,1,.36,1) both;
  }
  .connector .line{
    width:1.5px;height:28px;
    background:linear-gradient(to bottom, rgba(240,168,176,.7), rgba(240,168,176,.15));
  }
  .connector .node{
    width:9px;height:9px;border-radius:50%;
    background:var(--rose);
    box-shadow:0 0 0 4px rgba(240,168,176,.15), 0 0 18px var(--rose);
    animation:node 1.8s ease-in-out infinite;
  }
  @keyframes node{
    0%,100%{box-shadow:0 0 0 4px rgba(240,168,176,.12),0 0 14px var(--rose)}
    50%{box-shadow:0 0 0 7px rgba(240,168,176,.2),0 0 24px var(--rose)}
  }
  .connector .hint{
    margin-top:8px;
    font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--rose);
  }

  /* ===== PARTNER CARD — destaque ===== */
  .partner-wrap{
    padding:0 16px;
    animation:up .75s .22s cubic-bezier(.22,1,.36,1) both;
  }
  .partner{
    display:flex;align-items:center;gap:14px;
    padding:18px 16px 18px 18px;
    border-radius:22px;
    text-decoration:none;color:var(--text);
    position:relative;overflow:hidden;
    background:
      linear-gradient(145deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.03) 100%);
    border:1px solid rgba(240,168,176,.4);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 24px 48px rgba(0,0,0,.55),
      0 0 48px rgba(240,168,176,.15);
    transition:transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .22s;
  }
  .partner:hover{
    transform:translateY(-3px) scale(1.012);
    border-color:rgba(240,168,176,.6);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.07) inset,
      0 28px 56px rgba(0,0,0,.6),
      0 0 64px rgba(240,168,176,.28);
  }
  .partner:active{transform:scale(.985)}
  .partner::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--rose),var(--gold));
  }
  .partner::after{
    content:'';position:absolute;top:0;left:-50%;width:35%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
    transform:skewX(-18deg);animation:sweep 3.8s ease-in-out infinite;
  }
  @keyframes sweep{0%,100%{left:-50%}45%,55%{left:130%}}

  .p-ico{
    width:54px;height:54px;flex-shrink:0;border-radius:16px;
    display:grid;place-items:center;font-size:26px;
    background:linear-gradient(145deg,rgba(240,168,176,.3),rgba(228,201,165,.12));
    border:1px solid rgba(240,168,176,.4);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .p-body{flex:1;min-width:0}
  .p-body strong{
    display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;
  }
  .p-body span{font-size:12px;color:var(--muted);line-height:1.35}
  .p-tag{
    display:inline-block;margin-left:6px;vertical-align:middle;
    font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;
    background:rgba(240,168,176,.2);color:var(--rose);
    border:1px solid rgba(240,168,176,.35);
  }
  .p-go{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:rgba(240,168,176,.14);color:var(--rose);
    border:1px solid rgba(240,168,176,.25);
    transition:transform .2s;
  }
  .partner:hover .p-go{transform:translateX(4px)}
  .p-go svg{width:15px;height:15px}

  /* ===== STATS / extras (riqueza visual) ===== */
  .stats{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:10px;padding:22px 16px 0;
    animation:up .75s .3s cubic-bezier(.22,1,.36,1) both;
  }
  .stat{
    text-align:center;padding:14px 8px;border-radius:16px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
  }
  .stat b{
    display:block;font-family:var(--display);font-size:22px;font-weight:600;
    color:var(--gold);line-height:1.1;margin-bottom:4px;
  }
  .stat span{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}

  /* ===== SOCIAIS ===== */
  .socials-block{
    margin-top:28px;text-align:center;padding:0 16px;
    animation:up .75s .36s cubic-bezier(.22,1,.36,1) both;
  }
  .socials-block .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px;
  }
  .socials{display:flex;justify-content:center;gap:12px}
  .social{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;border-radius:16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);text-decoration:none;
    font-size:12px;font-weight:600;
    transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s;
  }
  .social:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.08);
    box-shadow:0 14px 32px rgba(0,0,0,.4);
  }
  .social svg{width:20px;height:20px;flex-shrink:0}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.4)}
  .social.yt:hover{color:#ff4444;border-color:rgba(255,68,68,.4)}

  /* ===== FOOTER ===== */
  footer{
    text-align:center;margin-top:36px;padding:24px 16px 0;
    border-top:1px solid rgba(255,255,255,.06);
    animation:up .75s .42s cubic-bezier(.22,1,.36,1) both;
  }
  footer .brand{font-family:var(--display);font-size:16px;font-weight:600;color:var(--gold);margin-bottom:4px}
  footer p{font-size:11px;color:var(--muted)}

  @keyframes up{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="page">

    <div class="top">
      <div class="logo">Biah <b>Ferreira</b></div>

    <!-- Vídeo limpo: fundo preto do próprio vídeo, sem máscara -->
    <div class="stage">

          <strong>Ybera Beauty <span class="p-tag">Parceira</span></strong>

        </div>
        <div class="p-go">

    </div>

      <div class="socials">

          Instagram
        </a>
        <a class="social yt" href="https://www.youtube.com/@biah.ferreira" target="_blank" rel="noopener noreferrer" aria-label="YouTube">

          YouTube
        </a>
      </div>
    </div>

    <footer>
      <p class="brand">Biah Ferreira</p>
      <p>Parcerias oficiais · © <span id="y"></span></p>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var v = document.getElementById('v');
    if (v) {
      v.muted = true;
      var p = v.play();
      if (p && p.catch) p.catch(function(){});
    }
  </script>
</body>
</html>
