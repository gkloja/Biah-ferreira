<style>
  :root{
    --bg:#0a0000;
    --text:#fff5f5;
    --muted:#c4a8a8;
    --rose:#ff6b81;
    --rose2:#e83a55;
    --gold:#f0c9a0;
    --ybera:#c93042;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{
    min-height:100dvh;font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ambiente vivo */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .fx .r1{
    position:absolute;width:70vw;height:70vw;max-width:420px;max-height:420px;
    top:-12%;left:50%;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(232,58,85,.28),transparent 68%);
    filter:blur(40px);animation:pulse 7s ease-in-out infinite;
  }
  .fx .r2{
    position:absolute;width:50vw;height:50vw;max-width:280px;max-height:280px;
    bottom:8%;right:-10%;
    background:radial-gradient(circle,rgba(201,48,66,.18),transparent 70%);
    filter:blur(50px);
  }
  .fx .r3{
    position:absolute;width:40vw;height:40vw;max-width:220px;max-height:220px;
    bottom:25%;left:-8%;
    background:radial-gradient(circle,rgba(240,180,100,.12),transparent 70%);
    filter:blur(45px);
  }
  @keyframes pulse{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}

  .page{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:14px 0 40px}

  /* header com foto */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px 10px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,107,129,.55);
    box-shadow:0 0 0 3px rgba(201,48,66,.2),0 4px 14px rgba(0,0,0,.4);
  }
  .brand-txt{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.1}
  .brand-txt em{font-style:normal;color:var(--gold)}
  .brand-txt small{display:block;font-family:var(--font);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--rose);margin-top:2px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#9dffc8;padding:6px 11px;border-radius:999px;
    background:rgba(79,212,168,.1);border:1px solid rgba(79,212,168,.28);
  }
  .chip i{
    width:6px;height:6px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.6s ease infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  .headline{text-align:center;padding:4px 16px 12px}
  .headline .kicker{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--rose);margin-bottom:8px;
    padding:4px 12px;border-radius:999px;
    background:rgba(232,58,85,.12);border:1px solid rgba(232,58,85,.28);
  }
  .headline h1{
    font-family:var(--display);
    font-size:clamp(32px,9vw,42px);font-weight:600;line-height:.95;
  }
  .headline h1 span{
    background:linear-gradient(115deg,#fff 0%,var(--rose) 45%,var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .headline p{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.45}

  .scene-wrap{padding:0 10px}
  .scene{
    position:relative;width:100%;
    aspect-ratio:1064 / 1200;
    background:#000;overflow:hidden;
    border-radius:20px;
    box-shadow:
      0 0 0 1px rgba(255,107,129,.18),
      0 28px 60px rgba(0,0,0,.55),
      0 0 50px rgba(201,48,66,.15);
  }
  .scene video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center top;background:#000;
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse 88% 78% at 50% 38%, transparent 42%, rgba(10,0,0,.45) 100%);
  }
  .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:42%;
    pointer-events:none;z-index:2;
    background:linear-gradient(to top,#0a0000 0%,rgba(10,0,0,.9) 18%,rgba(10,0,0,.5) 50%,transparent 100%);
  }
  .fade-top{
    position:absolute;left:0;right:0;top:0;height:14%;
    pointer-events:none;z-index:2;
    background:linear-gradient(to bottom,rgba(10,0,0,.4),transparent);
  }

  .in-video{
    position:absolute;left:12px;right:12px;
    top:74%;
    z-index:4;
  }
  .partner{
    display:flex;align-items:center;gap:12px;
    padding:12px;
    border-radius:18px;
    text-decoration:none;color:var(--text);
    background:rgba(20,4,8,.88);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,107,129,.45);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 16px 40px rgba(0,0,0,.5),
      0 0 36px rgba(201,48,66,.25);
    position:relative;
    animation:glow 3s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 16px 40px rgba(0,0,0,.5),0 0 28px rgba(201,48,66,.2)}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.07) inset,0 16px 40px rgba(0,0,0,.5),0 0 48px rgba(232,58,85,.35)}
  }
  .partner:active{transform:scale(.985)}
  .partner::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    border-radius:18px 0 0 18px;
    background:linear-gradient(180deg,var(--rose2),var(--gold));
  }

  .p-ico{
    width:52px;height:52px;flex-shrink:0;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(160deg,#1a1a1a,#0d0d0d);
    border:1px solid rgba(255,255,255,.12);
    padding:8px 6px;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .p-ico img{width:100%;height:auto;display:block;object-fit:contain}
  .p-body{flex:1;min-width:0}
  .p-body strong{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
  .p-body span{font-size:11px;color:#d4b4b8;line-height:1.3}
  .p-tag{
    display:inline-block;margin-left:6px;vertical-align:middle;
    font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 7px;border-radius:999px;
    background:rgba(232,58,85,.25);color:#ffb0bc;
    border:1px solid rgba(232,58,85,.45);
  }
  .p-go{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:linear-gradient(145deg,var(--rose2),#9e2030);
    color:#fff;box-shadow:0 4px 12px rgba(201,48,66,.4);
  }
  .p-go svg{width:13px;height:13px}

  .trust{
    text-align:center;margin-top:10px;
    font-size:10px;color:rgba(255,200,200,.5);
  }
  .trust b{color:rgba(255,140,155,.85);font-weight:600}

  .below{padding:24px 16px 0;text-align:center}
  .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .social{
    display:flex;align-items:center;gap:8px;
    padding:12px 18px;border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,107,129,.2);
    color:var(--text);text-decoration:none;
    font-size:12px;font-weight:600;
    transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s;
  }
  .social:hover{
    transform:translateY(-2px);
    background:rgba(255,107,129,.1);
    border-color:rgba(255,107,129,.4);
    box-shadow:0 10px 24px rgba(201,48,66,.2);
  }
  .social svg{width:18px;height:18px}
  .social.ig:hover{color:#ff5a7a}
  .social.yt:hover{color:#ff6b6b}

  footer{
    text-align:center;padding:22px 16px 0;
    font-size:11px;color:var(--muted);
  }
  footer b{font-family:var(--display);font-weight:600;color:var(--gold)}
</style>
</head>
