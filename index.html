<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#0c0b0d"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0c0b0d;
    --bg2:#141216;
    --card:rgba(255,255,255,.055);
    --card-h:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.1);
    --line2:rgba(232,196,180,.3);
    --text:#faf6f2;
    --muted:#b0a09a;
    --rose:#e8a0a8;
    --gold:#e4c9a5;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100dvh;font-family:var(--font);color:var(--text);
    background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* fundo suave */
  .fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .fx .a{
    position:absolute;width:380px;height:380px;border-radius:50%;
    filter:blur(100px);opacity:.35;
    background:radial-gradient(circle,#4a2030,transparent 70%);
    top:-80px;left:50%;transform:translateX(-50%);
  }
  .fx .b{
    position:absolute;width:260px;height:260px;border-radius:50%;
    filter:blur(90px);opacity:.2;
    background:radial-gradient(circle,#3a2a18,transparent 70%);
    bottom:10%;right:-40px;
  }

  .page{
    position:relative;z-index:1;
    max-width:420px;margin:0 auto;
    padding:28px 18px 56px;
  }

  /* ===== HEADER ===== */
  .top{
    text-align:center;
    margin-bottom:22px;
    animation:in .7s cubic-bezier(.22,1,.36,1) both;
  }
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--gold);margin-bottom:14px;
    padding:6px 12px;border-radius:999px;
    background:rgba(228,201,165,.08);border:1px solid rgba(228,201,165,.2);
  }
  .pill i{
    width:7px;height:7px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.8s ease infinite;
  }
  @keyframes blink{50%{opacity:.35}}

  h1{
    font-family:var(--display);
    font-size:clamp(36px,9vw,46px);font-weight:600;
    letter-spacing:.02em;line-height:1.05;margin-bottom:6px;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(120deg,var(--gold),var(--rose),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    font-size:13px;color:var(--muted);font-weight:400;line-height:1.45;
  }

  /* ===== VIDEO CARD ===== */
  .vid-card{
    position:relative;
    margin:22px auto 8px;
    width:min(100%, 300px);
    border-radius:28px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
      0 0 0 1px rgba(232,160,168,.08),
      0 28px 60px rgba(0,0,0,.55),
      0 0 80px rgba(232,160,168,.08);
    animation:in .8s .08s cubic-bezier(.22,1,.36,1) both;
  }
  /* anel sutil */
  .vid-card::before{
    content:'';
    position:absolute;inset:-1px;border-radius:28px;padding:1px;
    background:linear-gradient(160deg,rgba(232,160,168,.45),transparent 40%,transparent 60%,rgba(228,201,165,.35));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    pointer-events:none;z-index:3;
  }
  .vid-card video{
    display:block;width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    object-position:center 18%;
    background:#111;
  }
  .vid-fade{
    position:absolute;left:0;right:0;bottom:0;height:28%;
    background:linear-gradient(to top,#0c0b0d 0%,transparent 100%);
    pointer-events:none;z-index:2;
  }
  .vid-caption{
    position:absolute;left:0;right:0;bottom:14px;
    text-align:center;z-index:3;
    font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--rose);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    animation:bob 1.7s ease-in-out infinite;
  }
  .vid-caption svg{width:18px;height:18px;opacity:.9}
  @keyframes bob{
    0%,100%{transform:translateY(0);opacity:.75}
    50%{transform:translateY(5px);opacity:1}
  }

  /* ===== SOCIAIS ===== */
  .socials-block{
    text-align:center;
    margin:28px 0 26px;
    animation:in .75s .18s cubic-bezier(.22,1,.36,1) both;
  }
  .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .socials{display:flex;justify-content:center;gap:12px}
  .social{
    width:54px;height:54px;border-radius:18px;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);
    color:var(--text);text-decoration:none;
    transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s;
  }
  .social:hover{
    transform:translateY(-3px);
    background:var(--card-h);
    box-shadow:0 14px 32px rgba(0,0,0,.35);
  }
  .social svg{width:24px;height:24px}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.45)}
  .social.yt:hover{color:#ff3b3b;border-color:rgba(255,59,59,.45)}

  /* ===== PARCERIAS ===== */
  .sec{
    animation:in .75s .28s cubic-bezier(.22,1,.36,1) both;
  }
  .sec .lbl{margin-left:4px;margin-bottom:12px;text-align:left}

  .links{display:flex;flex-direction:column;gap:11px}

  .link{
    display:flex;align-items:center;gap:14px;
    padding:15px 16px;border-radius:20px;
    background:var(--card);border:1px solid var(--line);
    text-decoration:none;color:var(--text);
    position:relative;overflow:hidden;
    transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s,border-color .2s,box-shadow .22s;
  }
  .link::after{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--rose),var(--gold));
    opacity:0;transition:opacity .2s;
  }
  .link:hover{
    transform:translateY(-2px);
    background:var(--card-h);border-color:var(--line2);
    box-shadow:0 16px 40px rgba(0,0,0,.4);
  }
  .link:hover::after{opacity:1}
  .link:active{transform:scale(.985)}

  .link.hot{
    background:linear-gradient(135deg,rgba(232,160,168,.13),rgba(228,201,165,.05));
    border-color:rgba(232,160,168,.28);
  }
  .link.hot::after{opacity:1}

  .ico{
    width:48px;height:48px;flex-shrink:0;border-radius:15px;
    display:grid;place-items:center;font-size:20px;
    background:rgba(0,0,0,.3);border:1px solid var(--line);
  }
  .link.hot .ico{
    background:linear-gradient(145deg,rgba(232,160,168,.25),rgba(228,201,165,.1));
    border-color:rgba(232,160,168,.3);
  }
  .body{flex:1;min-width:0}
  .body b{
    display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px;
  }
  .body span{
    font-size:12px;color:var(--muted);display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tag{
    display:inline-block;font-size:9px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;padding:2px 8px;border-radius:999px;
    background:rgba(232,160,168,.15);color:var(--rose);
    border:1px solid rgba(232,160,168,.25);margin-left:6px;vertical-align:middle;
  }
  .go{
    width:30px;height:30px;flex-shrink:0;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.04);color:var(--muted);
    transition:transform .2s,background .2s,color .2s;
  }
  .link:hover .go{transform:translateX(3px);background:rgba(232,160,168,.15);color:var(--rose)}
  .go svg{width:14px;height:14px}

  footer{
    text-align:center;margin-top:40px;padding-top:22px;
    border-top:1px solid var(--line);
    animation:in .75s .4s cubic-bezier(.22,1,.36,1) both;
  }
  footer .brand{font-family:var(--display);font-size:17px;font-weight:600;color:var(--gold);margin-bottom:4px}
  footer p{font-size:11px;color:var(--muted)}

  @keyframes in{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="a"></div><div class="b"></div></div>

  <div class="page">

    <header class="top">
      <div class="pill"><i></i> Links oficiais</div>
      <h1>Biah <em>Ferreira</em></h1>
      <p class="sub">Influencer · parcerias selecionadas</p>
    </header>

    <!-- Vídeo em card (enquadrado, sem “buraco” preto) -->
    <div class="vid-card">
      <video id="v" autoplay muted loop playsinline poster="foto.jpg">

      </div>
    </div>

    <!-- Só parcerias -->
    <section class="sec">
      <p class="lbl">Parcerias</p>
      <nav class="links" aria-label="Parcerias">

      </nav>

    <footer>
      <p class="brand">Biah Ferreira</p>
      <p>Parcerias oficiais · © <span id="y"></span></p>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var v = document.getElementById('v');
    if (v) {
      v.muted = true;
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
  </script>
</body>
</html>
