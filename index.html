<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#000000"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --text:#faf6f2;
    --muted:#a89890;
    --rose:#f0a8b0;
    --gold:#e8d0b0;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--text)}
  body{
    min-height:100dvh;font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  .page{
    max-width:430px;margin:0 auto;
    min-height:100dvh;
    display:flex;flex-direction:column;
    padding:10px 0 28px;
  }

  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 16px 8px;
  }
  .logo{
    font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.02em;
  }
  .logo em{font-style:normal;color:var(--gold)}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#8fdfb8;padding:5px 10px;border-radius:999px;
    background:rgba(79,212,168,.08);border:1px solid rgba(79,212,168,.22);
  }
  .chip i{
    width:6px;height:6px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.6s ease infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  .headline{text-align:center;padding:4px 16px 10px}
  .headline h1{
    font-family:var(--display);
    font-size:clamp(30px,8.5vw,38px);font-weight:600;line-height:1;
  }
  .headline h1 span{
    background:linear-gradient(115deg,var(--gold),var(--rose),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .headline p{margin-top:6px;font-size:12px;color:var(--muted)}

  /* CENA: vídeo + botão DENTRO do frame */
  .scene{
    position:relative;
    width:100%;
    flex:1;
    min-height:62vh;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .scene video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 10%;
    background:#000;
  }
  /* só um véu bem baixo para o botão ler melhor — sem escurecer o rosto */
  .scene-veil{
    position:absolute;left:0;right:0;bottom:0;height:32%;
    background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.25) 55%, transparent 100%);
    pointer-events:none;
  }

  .in-video{
    position:relative;z-index:3;
    width:calc(100% - 28px);
    max-width:390px;
    margin:0 auto 22px;
  }
  .partner{
    display:flex;align-items:center;gap:12px;
    padding:14px 14px 14px 16px;
    border-radius:20px;
    text-decoration:none;color:var(--text);
    position:relative;overflow:hidden;
    background:rgba(18,14,16,.72);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(240,168,176,.45);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 16px 40px rgba(0,0,0,.45),
      0 0 36px rgba(240,168,176,.18);
    transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .partner:hover{
    transform:translateY(-2px) scale(1.015);
    border-color:rgba(240,168,176,.7);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08) inset,
      0 20px 48px rgba(0,0,0,.5),
      0 0 48px rgba(240,168,176,.28);
  }
  .partner:active{transform:scale(.985)}
  .partner::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--rose),var(--gold));
  }
  .p-ico{
    width:46px;height:46px;flex-shrink:0;border-radius:14px;
    display:grid;place-items:center;font-size:22px;
    background:linear-gradient(145deg,rgba(240,168,176,.32),rgba(228,201,165,.12));
    border:1px solid rgba(240,168,176,.4);
  }
  .p-body{flex:1;min-width:0}
  .p-body strong{
    display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px;
  }
  .p-body span{font-size:11.5px;color:#c4b6af}
  .p-tag{
    display:inline-block;margin-left:6px;vertical-align:middle;
    font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 7px;border-radius:999px;
    background:rgba(240,168,176,.2);color:var(--rose);
    border:1px solid rgba(240,168,176,.35);
  }
  .p-go{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:rgba(240,168,176,.16);color:var(--rose);
  }
  .p-go svg{width:14px;height:14px}

  .below{
    padding:18px 16px 0;
    text-align:center;
  }
  .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .socials{display:flex;justify-content:center;gap:10px}
  .social{
    display:flex;align-items:center;gap:8px;
    padding:11px 16px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);text-decoration:none;
    font-size:12px;font-weight:600;
    transition:transform .2s,background .2s,border-color .2s,color .2s;
  }
  .social:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)}
  .social svg{width:18px;height:18px}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.4)}
  .social.yt:hover{color:#ff4444;border-color:rgba(255,68,68,.4)}

  footer{
    text-align:center;padding:18px 16px 0;
    font-size:11px;color:var(--muted);
  }
  footer b{font-family:var(--display);font-weight:600;color:var(--gold)}
</style>
</head>
<body>
  <div class="page">

    <div class="top">
      <div class="logo">Biah <em>Ferreira</em></div>
      <div class="chip"><i></i> Oficial</div>
    </div>

    <header class="headline">
      <h1>Biah <span>Ferreira</span></h1>

      <div class="scene-veil"></div>

      <div class="in-video">

            <strong>Ybera Beauty <span class="p-tag">Parceira</span></strong>

          Instagram
        </a>
        <a class="social yt" href="https://www.youtube.com/@biah.ferreira" target="_blank" rel="noopener noreferrer">

          YouTube
        </a>
      </div>
    </div>

    <footer>
      <b>Biah Ferreira</b> · Parcerias oficiais · © <span id="y"></span>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var v = document.getElementById('v');
    if (v) {
      v.muted = true;
      var p = v.play();
      if (p && p.catch) p.catch(function(){});
    }
  </script>
</body>
</html>
