<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#0a0a0a"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0a;
    --card: rgba(255,255,255,.05);
    --card-h: rgba(255,255,255,.09);
    --stroke: rgba(255,255,255,.12);
    --stroke2: rgba(232,196,180,.28);
    --text: #faf6f2;
    --muted: #a89890;
    --rose: #e8a0a8;
    --gold: #e0c9a8;
    --font: 'Outfit', system-ui, sans-serif;
    --display: 'Cormorant Garamond', Georgia, serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100dvh;font-family:var(--font);color:var(--text);
    background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ——— HERO VIDEO ——— */
  .hero{
    position:relative;
    width:100%;
    max-width:440px;
    margin:0 auto;
    aspect-ratio:9/12;
    max-height:min(58vh, 520px);
    overflow:hidden;
    background:#000;
  }
  .hero video{
    width:100%;height:100%;
    object-fit:cover;object-position:center top;
    display:block;
  }
  .hero-fade{
    position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(to top, var(--bg) 8%, rgba(10,10,10,.55) 45%, transparent 100%);
    pointer-events:none;
  }
  .hero-name{
    position:absolute;left:0;right:0;bottom:28px;
    text-align:center;z-index:2;
    padding:0 20px;
    animation:up .9s cubic-bezier(.22,1,.36,1) both;
  }
  .hero-name .live{
    display:inline-flex;align-items:center;gap:7px;
    font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--gold);margin-bottom:8px;
  }
  .hero-name .live i{
    width:7px;height:7px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 10px #4fd4a8;animation:blink 1.8s ease infinite;
  }
  @keyframes blink{50%{opacity:.35}}
  .hero-name h1{
    font-family:var(--display);font-size:clamp(34px,8vw,44px);font-weight:600;
    letter-spacing:.02em;line-height:1.05;
  }
  .hero-name h1 span{
    background:linear-gradient(120deg,var(--gold),var(--rose),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-name p{
    margin-top:6px;font-size:13px;color:var(--muted);font-weight:400;
  }

  /* seta animada apontando para os botões */
  .point-hint{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    margin-top:14px;color:var(--rose);opacity:.85;
    animation:bob 1.6s ease-in-out infinite;
  }
  .point-hint svg{width:22px;height:22px}
  .point-hint span{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(6px)}
  }

  .shell{
    position:relative;z-index:2;
    max-width:440px;margin:-8px auto 0;
    padding:0 18px 56px;
  }

  /* ——— SOCIAL ICONS ——— */
  .socials-wrap{
    text-align:center;
    margin-bottom:28px;
    animation:up .8s .15s cubic-bezier(.22,1,.36,1) both;
  }
  .socials-label{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .socials{
    display:flex;justify-content:center;gap:14px;
  }
  .social{
    width:52px;height:52px;border-radius:16px;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--stroke);
    color:var(--text);text-decoration:none;
    transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;
  }
  .social:hover{
    transform:translateY(-3px) scale(1.04);
    background:var(--card-h);border-color:var(--stroke2);
    box-shadow:0 12px 28px rgba(0,0,0,.35);
  }
  .social svg{width:22px;height:22px}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.4)}
  .social.yt:hover{color:#ff4444;border-color:rgba(255,68,68,.4)}

  /* ——— PARCERIAS ——— */
  .sec-label{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px 4px;
    animation:up .8s .2s cubic-bezier(.22,1,.36,1) both;
  }
  .links{display:flex;flex-direction:column;gap:12px}

  .link{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:18px;
    background:var(--card);border:1px solid var(--stroke);
    text-decoration:none;color:var(--text);
    position:relative;overflow:hidden;
    transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s,border-color .22s,box-shadow .22s;
    animation:up .75s cubic-bezier(.22,1,.36,1) both;
  }
  .link:nth-child(1){animation-delay:.25s}
  .link:nth-child(2){animation-delay:.33s}
  .link:nth-child(3){animation-delay:.41s}

  .link::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--rose),var(--gold));
    opacity:0;transition:opacity .2s;
  }
  .link:hover{
    transform:translateY(-3px);background:var(--card-h);
    border-color:var(--stroke2);box-shadow:0 18px 40px rgba(0,0,0,.4);
  }
  .link:hover::before{opacity:1}
  .link:active{transform:scale(.985)}

  .link.featured{
    background:linear-gradient(135deg,rgba(232,160,168,.12),rgba(224,201,168,.06));
    border-color:rgba(232,160,168,.32);
  }
  .link.featured::before{opacity:1}

  .link-ico{
    width:48px;height:48px;flex-shrink:0;border-radius:14px;
    display:grid;place-items:center;font-size:22px;
    background:rgba(0,0,0,.35);border:1px solid var(--stroke);
  }
  .link.featured .link-ico{
    background:linear-gradient(145deg,rgba(232,160,168,.22),rgba(224,201,168,.1));
    border-color:rgba(232,160,168,.35);
  }
  .link-body{flex:1;min-width:0}
  .link-body strong{
    display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px;
  }
  .link-body span{
    font-size:12px;color:var(--muted);display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tag{
    display:inline-block;font-size:9px;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;padding:3px 8px;border-radius:999px;
    background:rgba(232,160,168,.16);color:var(--rose);
    border:1px solid rgba(232,160,168,.28);margin-left:6px;vertical-align:middle;
  }
  .link-arrow{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.04);color:var(--muted);
    transition:transform .2s,background .2s,color .2s;
  }
  .link:hover .link-arrow{
    transform:translateX(3px);background:rgba(232,160,168,.14);color:var(--rose);
  }
  .link-arrow svg{width:14px;height:14px}

  footer{
    text-align:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--stroke);
    animation:up .8s .5s cubic-bezier(.22,1,.36,1) both;
  }
  footer .brand{font-family:var(--display);font-size:16px;font-weight:600;color:var(--gold);margin-bottom:4px}
  footer p{font-size:11px;color:var(--muted);line-height:1.5}

  @keyframes up{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:none}
  }

  @media(max-width:400px){
    .hero{max-height:52vh}
  }
</style>
</head>
<body>

  <!-- Vídeo: ela aponta para baixo → botões de parceria -->
  <section class="hero" aria-label="Apresentação">
    <video
      autoplay muted loop playsinline
      poster="foto.jpg"
      id="introVid"
    >
      <source src="biah-intro-web.mp4" type="video/mp4"/>
    </video>
    <div class="hero-fade"></div>
    <div class="hero-name">
      <div class="live"><i></i> Links oficiais</div>
      <h1>Biah <span>Ferreira</span></h1>
      <p>Influencer · parcerias selecionadas</p>
      <div class="point-hint" aria-hidden="true">
        <span>parcerias</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
      </div>
    </div>
  </section>

  <main class="shell">

    <!-- Redes sociais — só ícones -->
    <div class="socials-wrap">
      <p class="socials-label">Me acompanhe</p>
      <div class="socials">
        <a class="social ig"
           href="https://www.instagram.com/biah.ferreira__"
           target="_blank" rel="noopener noreferrer"
           aria-label="Instagram" title="Instagram">
          <!-- Instagram glyph -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
          </svg>
        </a>
        <a class="social yt"
           href="https://www.youtube.com/@biah.ferreira"
           target="_blank" rel="noopener noreferrer"
           aria-label="YouTube" title="YouTube">
          <!-- YouTube glyph -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Só parcerias -->
    <p class="sec-label">Parcerias</p>
    <nav class="links" aria-label="Links de parceria">

      <a class="link featured" href="https://www.ybera.com?parceiro=92819" target="_blank" rel="noopener noreferrer">
        <div class="link-ico">✨</div>
        <div class="link-body">
          <strong>Ybera Beauty <span class="tag">Parceira</span></strong>
          <span>Cosméticos &amp; cuidados — link exclusivo</span>
        </div>
        <div class="link-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </a>

      <!-- Novo parceiro: copie o bloco acima e troque href / título / descrição -->

    </nav>

    <footer>
      <p class="brand">Biah Ferreira</p>
      <p>Parcerias oficiais · © <span id="y"></span></p>
    </footer>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    // Garante autoplay em iOS / Android
    var v = document.getElementById('introVid');
    if (v) {
      v.muted = true;
      var p = v.play();
      if (p && p.catch) p.catch(function(){});
    }
  </script>
</body>
</html>
