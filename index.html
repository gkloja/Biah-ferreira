<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#000000"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --text:#faf6f2;
    --muted:#a89890;
    --rose:#f0a8b0;
    --gold:#e8d0b0;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--text)}
  body{
    min-height:100dvh;font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  .page{
    max-width:430px;margin:0 auto;
    padding:12px 0 32px;
  }

  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px 8px;
  }
  .logo{font-family:var(--display);font-size:16px;font-weight:600}
  .logo em{font-style:normal;color:var(--gold)}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:#8fdfb8;padding:5px 10px;border-radius:999px;
    background:rgba(79,212,168,.08);border:1px solid rgba(79,212,168,.22);
  }
  .chip i{
    width:6px;height:6px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.6s ease infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  .headline{text-align:center;padding:2px 16px 6px}
  .headline h1{
    font-family:var(--display);
    font-size:clamp(28px,8vw,36px);font-weight:600;line-height:1;
  }
  .headline h1 span{
    background:linear-gradient(115deg,var(--gold),var(--rose),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .headline p{margin-top:5px;font-size:12px;color:var(--muted)}

  /* Vídeo recortado + botão na altura dos dedos */
  .scene{
    position:relative;
    width:100%;
    /* crop 1064x1200 */
    aspect-ratio:1064 / 1200;
    background:#000;
    overflow:hidden;
  }
  .scene video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center top;
    background:#000;
  }

  .in-video{
    position:absolute;
    left:14px;right:14px;
    /* dedos apontam ~58–64% da altura do crop */
    top:62%;
    z-index:3;
  }
  .partner{
    display:flex;align-items:center;gap:12px;
    padding:13px 13px 13px 15px;
    border-radius:18px;
    text-decoration:none;color:var(--text);
    background:rgba(12,10,12,.78);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(240,168,176,.48);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 14px 36px rgba(0,0,0,.45),
      0 0 28px rgba(240,168,176,.16);
  }
  .partner:active{transform:scale(.985)}
  .p-ico{
    width:44px;height:44px;flex-shrink:0;border-radius:13px;
    display:grid;place-items:center;font-size:20px;
    background:linear-gradient(145deg,rgba(240,168,176,.32),rgba(228,201,165,.12));
    border:1px solid rgba(240,168,176,.4);
  }
  .p-body{flex:1;min-width:0}
  .p-body strong{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
  .p-body span{font-size:11px;color:#c4b6af}
  .p-tag{
    display:inline-block;margin-left:6px;vertical-align:middle;
    font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 7px;border-radius:999px;
    background:rgba(240,168,176,.2);color:var(--rose);
    border:1px solid rgba(240,168,176,.35);
  }
  .p-go{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:rgba(240,168,176,.16);color:var(--rose);
  }
  .p-go svg{width:13px;height:13px}

  .below{padding:18px 16px 0;text-align:center}
  .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .socials{display:flex;justify-content:center;gap:10px}
  .social{
    display:flex;align-items:center;gap:8px;
    padding:11px 16px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);text-decoration:none;
    font-size:12px;font-weight:600;
  }
  .social svg{width:18px;height:18px}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.4)}
  .social.yt:hover{color:#ff4444;border-color:rgba(255,68,68,.4)}

  footer{
    text-align:center;padding:16px 16px 0;
    font-size:11px;color:var(--muted);
  }
  footer b{font-family:var(--display);font-weight:600;color:var(--gold)}
</style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="logo">Biah <em>Ferreira</em></div>
      <div class="chip"><i></i> Oficial</div>
    </div>

    <header class="headline">
      <h1>Biah <span>Ferreira</span></h1>
      <p>Influencer · parcerias selecionadas</p>
    </header>

    <section class="scene">
      <video id="v" autoplay muted loop playsinline poster="foto.jpg">
        <source src="biah-intro-web.mp4" type="video/mp4"/>
      </video>
      <div class="in-video">
        <a class="partner" href="https://www.ybera.com?parceiro=92819" target="_blank" rel="noopener noreferrer">
          <div class="p-ico">✨</div>
          <div class="p-body">
            <strong>Ybera Beauty <span class="p-tag">Parceira</span></strong>
            <span>Cosméticos &amp; cuidados — link exclusivo</span>
          </div>
          <div class="p-go">

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          Instagram
        </a>
        <a class="social yt" href="https://www.youtube.com/@biah.ferreira" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          YouTube
        </a>
      </div>
    </div>

    <footer>
      <b>Biah Ferreira</b> · Parcerias oficiais · © <span id="y"></span>
    </footer>
  </div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var v = document.getElementById('v');
    if (v) { v.muted = true; var p = v.play(); if (p && p.catch) p.catch(function(){}); }
  </script>
</body>
</html>
